name: Validate Recipes Dataset

on:
  push:
    paths:
      - "data/recipes.json"
      - "scripts/validate-recipes.js"
      - ".github/workflows/validate-recipes.yml"
  pull_request:
    paths:
      - "data/recipes.json"
      - "scripts/validate-recipes.js"
      - ".github/workflows/validate-recipes.yml"

jobs:
  validate-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate recipe data
        run: node scripts/validate-recipes.js
